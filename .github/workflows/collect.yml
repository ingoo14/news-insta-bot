name: 연예뉴스 자동 업로드

on:
  schedule:
    # 2시간마다 (하루 12회 × 2건 = 24건) — 한국시간 매 홀수시 17분
    - cron: "17 */2 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: git 사용자 설정
        run: |
          git config --global user.name "news-bot"
          git config --global user.email "news-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt

      - name: 1. 수집 → 요약 → 사진 카드 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          ACCENT_COLOR: ${{ vars.ACCENT_COLOR }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
        run: python -m bot.collect

      - name: 2. 카드 이미지 저장소에 올리기
        if: always()
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "cards: $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          sleep 20   # 이미지 주소가 열릴 때까지 잠깐 대기

      - name: 3. 인스타 자동 업로드 → 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
          IMAGE_HOST: ${{ vars.IMAGE_HOST }}
        run: python -m bot.publish

      - name: 4. 결과 저장
        if: always()
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "published: $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
