name: 연예뉴스 자동 업로드

on:
  # 정기 실행은 Cloudflare 예약(Cron Trigger)이 2시간마다 호출 (GitHub 자체 예약은 자주 누락돼서 사용 안 함)
  # 한국시간 06·08·10·12·14·16·18·20·22·00·02·04시 정각 업로드
  # 회차당: ibduck_music 2건 + greenlight_music 1건 + gaem_seong_1spoon 1건
  workflow_dispatch:
    inputs:
      scheduled:
        description: "정기 실행 여부 (자동 입력 — 손으로 돌릴 땐 비워두면 바로 업로드)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: news-bot-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: git 사용자 설정
        run: |
          git config --global user.name "news-bot"
          git config --global user.email "news-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 한글 폰트 설치
        run: |
          # 1차: 바로 설치 (최대 90초) → 2차: 목록 갱신 후 설치 (최대 90초) → 3차: GitHub에서 폰트 파일 직접 받기
          if timeout 90 sudo apt-get install -y -qq fonts-noto-cjk; then echo "apt 설치 완료"; exit 0; fi
          if timeout 90 sudo apt-get update -qq && timeout 90 sudo apt-get install -y -qq fonts-noto-cjk; then echo "apt 설치 완료"; exit 0; fi
          echo "apt 실패 → 폰트 직접 다운로드"
          mkdir -p fonts
          for f in Sans/SubsetOTF/KR/NotoSansKR-Regular.otf Sans/SubsetOTF/KR/NotoSansKR-Bold.otf Sans/SubsetOTF/KR/NotoSansKR-Black.otf Serif/SubsetOTF/KR/NotoSerifKR-Bold.otf Serif/SubsetOTF/KR/NotoSerifKR-Black.otf; do
            n=$(basename "$f")
            curl -fsSL --max-time 60 -o "fonts/$n" "https://github.com/notofonts/noto-cjk/raw/main/$f" \
              || curl -fsSL --max-time 60 -o "fonts/$n" "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/$f" \
              || echo "다운로드 실패: $n"
          done
          ls -la fonts
      - run: pip install -r requirements.txt

      - name: 1. 트렌드·뉴스 수집 → 선별·요약 → 매거진 카드 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          ACCENT_COLOR: ${{ vars.ACCENT_COLOR }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MASTHEAD: ${{ vars.MASTHEAD }}
          PHOTO_STRICT: ${{ vars.PHOTO_STRICT }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USER_ID_3: ${{ secrets.IG_USER_ID_3 }}
          IG_ACCESS_TOKEN_3: ${{ secrets.IG_ACCESS_TOKEN_3 }}
          IG_HANDLE_1: ibduck_music
          IG_HANDLE_2: greenlight_music
          IG_HANDLE_3: gaem_seong_1spoon
        run: python -m bot.collect

      - name: 2. 카드 이미지 저장소에 올리기
        if: always()
        run: |
          git add -A -- . ':!fonts'
          git diff --cached --quiet && exit 0
          git commit -m "cards: $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
          sleep 20   # 이미지 주소가 열릴 때까지 잠깐 대기

      - name: 정각까지 대기 (예약 실행일 때만)
        if: github.event.inputs.scheduled == 'true'
        run: |
          python - <<'EOF'
          import time
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=9)))
          target = now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1)
          wait = (target - now).total_seconds()
          if target.hour % 2 == 0 and 0 < wait <= 55 * 60:
              print(f"{target:%H:%M} 정각까지 {int(wait)}초 대기")
              time.sleep(wait)
          else:
              print("정각이 이미 지났거나 범위 밖 → 바로 업로드")
          EOF

      - name: 3. 인스타 자동 업로드 → 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USER_ID_3: ${{ secrets.IG_USER_ID_3 }}
          IG_ACCESS_TOKEN_3: ${{ secrets.IG_ACCESS_TOKEN_3 }}
          IG_HANDLE_1: ibduck_music
          IG_HANDLE_2: greenlight_music
          IG_HANDLE_3: gaem_seong_1spoon
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
          IMAGE_HOST: ${{ vars.IMAGE_HOST }}
          PUBLISH_KIND: auto
        run: python -m bot.publish

      - name: 4. 결과 저장
        if: always()
        run: |
          git add -A -- . ':!fonts'
          git diff --cached --quiet && exit 0
          git commit -m "published: $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done
