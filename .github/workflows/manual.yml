name: 링크로 바로 올리기

# 텔레그램 단톡방에 링크를 올리면 → Cloudflare 중계 → 즉시 실행
# 급할 때는 Actions에서 Run workflow → 링크 입력으로도 실행 가능
on:
  workflow_dispatch:
    inputs:
      url:
        description: "올릴 기사 링크 (앞에 greenlight / gaem 을 쓰면 그 채널로)"
        required: false
      text:
        description: "(텔레그램 자동 입력용 — 비워두기)"
        required: false
      file_id:
        description: "(텔레그램 자동 입력용 — 비워두기)"
        required: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"   # 로그를 실시간으로 보이게

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: git 사용자 설정
        run: |
          git config --global user.name "news-bot"
          git config --global user.email "news-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 한글 폰트 설치
        run: |
          # 1차: 바로 설치 (최대 90초) → 2차: 목록 갱신 후 설치 (최대 90초) → 3차: GitHub에서 폰트 파일 직접 받기
          if timeout 90 sudo apt-get install -y -qq fonts-noto-cjk; then echo "apt 설치 완료"; exit 0; fi
          if timeout 90 sudo apt-get update -qq && timeout 90 sudo apt-get install -y -qq fonts-noto-cjk; then echo "apt 설치 완료"; exit 0; fi
          echo "apt 실패 → 폰트 직접 다운로드"
          mkdir -p fonts
          for f in Sans/SubsetOTF/KR/NotoSansKR-Regular.otf Sans/SubsetOTF/KR/NotoSansKR-Bold.otf Sans/SubsetOTF/KR/NotoSansKR-Black.otf Serif/SubsetOTF/KR/NotoSerifKR-Bold.otf Serif/SubsetOTF/KR/NotoSerifKR-Black.otf; do
            n=$(basename "$f")
            curl -fsSL --max-time 60 -o "fonts/$n" "https://github.com/notofonts/noto-cjk/raw/main/$f" \
              || curl -fsSL --max-time 60 -o "fonts/$n" "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/$f" \
              || echo "다운로드 실패: $n"
          done
          ls -la fonts
      - run: pip install -r requirements.txt

      - name: 1. 링크 → 요약 → 카드 생성
        env:
          TG_WEBHOOK: "1"
          TG_TEXT: ${{ github.event.inputs.text }}
          TG_FILE_ID: ${{ github.event.inputs.file_id }}
          MANUAL_URL: ${{ github.event.inputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          ACCENT_COLOR: ${{ vars.ACCENT_COLOR }}
          PHOTO_STRICT: ${{ vars.PHOTO_STRICT }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USER_ID_3: ${{ secrets.IG_USER_ID_3 }}
          IG_ACCESS_TOKEN_3: ${{ secrets.IG_ACCESS_TOKEN_3 }}
          IG_HANDLE_1: ibduck_music
          IG_HANDLE_2: greenlight_music
          IG_HANDLE_3: gaem_seong_1spoon
        run: python -m bot.manual

      - name: 2. 카드 이미지 저장소에 올리기
        if: always()
        run: |
          git add -A -- . ':!fonts'
          git diff --cached --quiet && exit 0
          git commit -m "manual: $(date -u +%Y%m%d-%H%M%S)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
          sleep 20

      - name: 3. 인스타 업로드 → 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USER_ID_3: ${{ secrets.IG_USER_ID_3 }}
          IG_ACCESS_TOKEN_3: ${{ secrets.IG_ACCESS_TOKEN_3 }}
          IG_HANDLE_1: ibduck_music
          IG_HANDLE_2: greenlight_music
          IG_HANDLE_3: gaem_seong_1spoon
          IG_AI_LABEL: ${{ vars.IG_AI_LABEL }}
          IMAGE_HOST: ${{ vars.IMAGE_HOST }}
          PUBLISH_KIND: manual
        run: python -m bot.publish

      - name: 4. 결과 저장
        if: always()
        run: |
          git add -A -- . ':!fonts'
          git diff --cached --quiet && exit 0
          git commit -m "manual published: $(date -u +%Y%m%d-%H%M%S)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
